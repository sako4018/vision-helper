<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Какво има пред мен</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 600 28px system-ui, sans-serif; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 24px; background: rgba(0,0,0,.7); text-align: center; }
  #toggle { position: fixed; inset: 0; width: 100%; height: 100%; background: transparent; border: 0; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted aria-hidden="true"></video>
<button id="toggle" aria-label="Старт или пауза"></button>
<div id="status" role="status" aria-live="polite">Докоснете екрана, за да започнете</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const cam = document.getElementById('cam');
const status = document.getElementById('status');

const BG = {
  'person': 'човек', 'bicycle': 'колело', 'car': 'кола', 'motorcycle': 'мотор', 'airplane': 'самолет',
  'bus': 'автобус', 'train': 'влак', 'truck': 'камион', 'boat': 'лодка', 'traffic light': 'светофар',
  'fire hydrant': 'хидрант', 'stop sign': 'знак стоп', 'parking meter': 'паркомер', 'bench': 'пейка',
  'bird': 'птица', 'cat': 'котка', 'dog': 'куче', 'horse': 'кон', 'sheep': 'овца', 'cow': 'крава',
  'elephant': 'слон', 'bear': 'мечка', 'zebra': 'зебра', 'giraffe': 'жираф', 'backpack': 'раница',
  'umbrella': 'чадър', 'handbag': 'чанта', 'tie': 'вратовръзка', 'suitcase': 'куфар', 'frisbee': 'фризби',
  'skis': 'ски', 'snowboard': 'сноуборд', 'sports ball': 'топка', 'kite': 'хвърчило',
  'baseball bat': 'бухалка', 'baseball glove': 'ръкавица', 'skateboard': 'скейтборд', 'surfboard': 'сърф',
  'tennis racket': 'ракета', 'bottle': 'бутилка', 'wine glass': 'чаша за вино', 'cup': 'чаша',
  'fork': 'вилица', 'knife': 'нож', 'spoon': 'лъжица', 'bowl': 'купа', 'banana': 'банан', 'apple': 'ябълка',
  'sandwich': 'сандвич', 'orange': 'портокал', 'broccoli': 'броколи', 'carrot': 'морков', 'hot dog': 'хотдог',
  'pizza': 'пица', 'donut': 'поничка', 'cake': 'торта', 'chair': 'стол', 'couch': 'диван',
  'potted plant': 'саксия', 'bed': 'легло', 'dining table': 'маса', 'toilet': 'тоалетна', 'tv': 'телевизор',
  'laptop': 'лаптоп', 'mouse': 'мишка', 'remote': 'дистанционно', 'keyboard': 'клавиатура',
  'cell phone': 'телефон', 'microwave': 'микровълнова', 'oven': 'фурна', 'toaster': 'тостер',
  'sink': 'мивка', 'refrigerator': 'хладилник', 'book': 'книга', 'clock': 'часовник', 'vase': 'ваза',
  'scissors': 'ножица', 'teddy bear': 'плюшено мече', 'hair drier': 'сешоар', 'toothbrush': 'четка за зъби',
};

function where([x, , w]) {
  const center = (x + w / 2) / cam.videoWidth;
  return center < 0.35 ? 'вляво' : center > 0.65 ? 'вдясно' : 'отпред';
}

let running = false, started = false, lastSaid = '';

function say(text) {
  if (text === lastSaid || speechSynthesis.speaking) return;
  lastSaid = text;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'bg-BG';
  speechSynthesis.speak(u);
}

document.getElementById('toggle').onclick = () => {
  if (!started) { started = running = true; say('Започвам'); start(); return; }
  running = !running;
  speechSynthesis.cancel();
  lastSaid = '';
  status.textContent = running ? 'Продължавам' : 'Пауза';
  say(status.textContent);
};

async function start() {
  try {
    cam.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch {
    status.textContent = 'Няма достъп до камерата';
    return;
  }
  status.textContent = 'Зареждам модела…';
  const model = await cocoSsd.load();
  status.textContent = 'Готово';
  setInterval(async () => {
    if (!running || cam.readyState < 2) return;
    const found = (await model.detect(cam)).filter(d => d.score > 0.6);
    if (!found.length) return;
    const text = [...new Set(found.map(d => `${BG[d.class] ?? d.class} ${where(d.bbox)}`))].sort().join(', ');
    status.textContent = text;
    say(text);
  }, 2000);
}
start();
</script>
</body>
</html>
