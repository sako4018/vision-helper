<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Какво има пред мен</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 600 28px system-ui, sans-serif; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 24px; background: rgba(0,0,0,.7); text-align: center; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted aria-hidden="true"></video>
<div id="status" role="status" aria-live="polite">Пускам камерата…</div>
<script>
const cam = document.getElementById('cam');
const status = document.getElementById('status');

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
  .then(stream => { cam.srcObject = stream; status.textContent = 'Камерата работи'; })
  .catch(() => { status.textContent = 'Няма достъп до камерата'; });
</script>
</body>
</html>
